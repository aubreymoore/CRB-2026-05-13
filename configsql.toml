create_v_camera_movement_sql = '''
CREATE VIEW IF NOT EXISTS v_camera_movement AS
SELECT 
    image_id,
    timestamp,
    location,
    ST_Distance(location, LAG(location) OVER (ORDER BY timestamp), 1) AS meters_from_previous_location
FROM images
ORDER BY timestamp
'''

